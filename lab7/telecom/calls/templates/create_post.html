<!DOCTYPE html>
<html>
<head>
    <title>Учёт переговоров — добавить запись</title>
    <link rel="stylesheet" href="{{ STATIC_URL }}/static/css/call.css">
</head>
<body class="create-post">
    <div class="header">
        <img src="{{ STATIC_URL }}/static/img/logo.png" />
        <a href="/" class="all-articles">Все записи</a>
    </div>
    <div class="content">
        <h1>Добавить запись о звонке</h1>
        <form method="POST">{% csrf_token %}
            <input type="text" name="city" placeholder="Город назначения" value="{{ form.city|default:'' }}">
            <textarea name="details" placeholder="Детализация звонка, время суток, длительность, скидка и стоимость">{{ form.details|default:'' }}</textarea>
            <input type="submit" value="Сохранить">
        </form>
        {% if form.errors %}
            <div class="form-errors">{{ form.errors }}</div>
        {% endif %}
    </div>
</body>
</html>
