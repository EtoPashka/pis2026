<!DOCTYPE html>
<html>
<head>
    <title>Учёт переговоров — вход</title>
    <link rel="stylesheet" href="{{ STATIC_URL }}/static/css/call.css">
</head>
<body class="auth-page">
    <div class="header">
        <img src="{{ STATIC_URL }}/static/img/logo.png" />
        <a href="/" class="all-articles">Все записи</a>
    </div>
    <div class="content">
        <h1>Вход в систему</h1>
        <form method="POST">{% csrf_token %}
            <input type="text" name="username" placeholder="Логин" value="{{ form.username|default:'' }}">
            <input type="password" name="password" placeholder="Пароль">
            <input type="submit" value="Войти">
        </form>
        {% if form.errors %}
            <div class="form-errors">{{ form.errors }}</div>
        {% endif %}
        <p class="auth-switch">Нет аккаунта? <a href="/register/">Регистрация</a></p>
    </div>
</body>
</html>
